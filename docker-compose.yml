services:
  dbsync:
    build: .
    container_name: dbsync
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - /etc/localtime:/etc/localtime:ro  # 同步宿主机时区
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - SECRET_KEY=change-this-to-a-random-secret-key # 生成方式: python -c "import secrets; print(secrets.token_urlsafe(32))"
      - TZ=Asia/Shanghai  # 设置时区为北京时间
    restart: unless-stopped
    networks:
      - dbsync-net

networks:
  dbsync-net:
    driver: bridge
