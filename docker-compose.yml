services:
  dbsync:
    build: .
    image: dbsync:latest
    container_name: dbsync
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - /etc/localtime:/etc/localtime:ro
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      # 请把下面的值改成你自己的随机密钥后再启动，否则容器会拒绝启动并提示。
      # 生成方式：python -c "import secrets; print(secrets.token_urlsafe(32))"
      # 密钥用于加密数据库密码，设定后请勿更改，否则已保存的密码将无法解密。
      - SECRET_KEY=change-this-to-a-random-secret-key
      - BACKUP_DIR=/app/backups
      - LOG_LEVEL=INFO
      - TZ=Asia/Shanghai
    restart: unless-stopped
