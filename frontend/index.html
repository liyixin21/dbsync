<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>DBSync · 数据库同步备份</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cellipse cx='12' cy='6' rx='8' ry='3' fill='%232f6feb'/%3E%3Cpath d='M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6' stroke='%232f6feb' stroke-width='2' fill='none'/%3E%3C/svg%3E" />
  <script>
    // 在任何渲染前应用主题，消除闪烁
    (function () {
      try {
        var dark = localStorage.getItem('dbsync_dark');
        if (dark === null) {
          dark = window.matchMedia('(prefers-color-scheme: dark)').matches ? '1' : '0';
        }
        if (dark === '1') document.documentElement.setAttribute('data-theme', 'dark');
        var primary = localStorage.getItem('dbsync_primary');
        if (primary) document.documentElement.style.setProperty('--primary', primary);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
