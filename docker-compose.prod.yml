# 生产部署编排：使用已发布的镜像，无需源码构建。
#
#   docker compose -f docker-compose.prod.yml up -d
#
# 与 docker-compose.yml 的区别：
#   - 本文件用 image: 拉取现成镜像，适合生产机部署
#   - docker-compose.yml 用 build: 从源码构建，适合本地开发
services:
  dbsync:
    image: liyixin21/dbsync:latest
    container_name: dbsync
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - /etc/localtime:/etc/localtime:ro
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      # 请把下面的值改成你自己的随机密钥后再启动，否则容器会拒绝启动并提示。
      # 生成方式：python -c "import secrets; print(secrets.token_urlsafe(32))"
      # 密钥用于加密数据库密码，设定后请勿更改，否则已保存的密码将无法解密。
      - SECRET_KEY=change-this-to-a-random-secret-key
      - BACKUP_DIR=/app/backups
      - LOG_LEVEL=INFO
      - TZ=Asia/Shanghai
    restart: unless-stopped
    networks:
      - dbsync-net

networks:
  dbsync-net:
    driver: bridge
