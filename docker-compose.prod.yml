services:
  dbsync:
    image: liyixin21/dbsync:latest
    container_name: dbsync
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - /etc/localtime:/etc/localtime:ro
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - SECRET_KEY=change-this-to-a-random-secret-key
      - TZ=Asia/Shanghai
    restart: unless-stopped
    networks:
      - dbsync-net

networks:
  dbsync-net:
    driver: bridge